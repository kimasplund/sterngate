[workspace]
resolver = "2"
members = [
    "crates/sterngate-core",
    "crates/sterngate-hal",
    "crates/sterngate-protocol",
    "crates/sterngate-p2p",
    "crates/sterngate-server",
    "crates/sterngate-mcp",
    "crates/sterngate-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sterngate Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sterngate/sterngate"
readme = "README.md"
rust-version = "1.89"

[workspace.dependencies]
# Internal workspace crates
sterngate-core = { path = "crates/sterngate-core", version = "0.1.0" }
sterngate-hal = { path = "crates/sterngate-hal", version = "0.1.0" }
sterngate-protocol = { path = "crates/sterngate-protocol", version = "0.1.0" }
sterngate-p2p = { path = "crates/sterngate-p2p", version = "0.1.0" }
sterngate-server = { path = "crates/sterngate-server", version = "0.1.0" }
sterngate-mcp = { path = "crates/sterngate-mcp", version = "0.1.0" }

# Async runtime & networking
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
async-trait = "0.1"
bytes = "1.10"

# Web server & API
axum = { version = "0.8.9", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }

# P2P & Mesh
iroh = "1.2.0"

# CAN & Automotive
socketcan = { version = "4.0.0", features = ["tokio"] }
rusb = "0.9"

# Serialization & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }

# Utilities, Hashing, & Crypto
thiserror = "2.0"
anyhow = "1.0"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.5"
sha2 = "0.10"
uuid = { version = "1.12", features = ["v4", "serde"] }
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

